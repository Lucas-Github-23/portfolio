<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="100%" stop-color="#121218" />
    </linearGradient>
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="50%" stop-color="#FF3300" />
      <stop offset="100%" stop-color="#E0002A" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF1744" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF5500" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Full-bleed background that fills 100% of any square or circular mask -->
  <rect width="128" height="128" fill="url(#bgGrad)" />

  <!-- Outer Tactical HUD Perimeter Ring (concentric to Google Search circular crop) -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.85" />
  <circle cx="64" cy="64" r="62.5" fill="none" stroke="#252530" stroke-width="1.5" />

  <!-- Cardinal Tactical Crosshair Reticles -->
  <line x1="64" y1="2" x2="64" y2="9" stroke="#FF5500" stroke-width="2.5" />
  <line x1="64" y1="119" x2="64" y2="126" stroke="#FF5500" stroke-width="2.5" />
  <line x1="2" y1="64" x2="9" y2="64" stroke="#FF5500" stroke-width="2.5" />
  <line x1="119" y1="64" x2="126" y2="64" stroke="#FF5500" stroke-width="2.5" />

  <!-- Tactical Sync Status Indicators -->
  <circle cx="64" cy="5.5" r="2.5" fill="#00FF66" />
  <circle cx="64" cy="122.5" r="2.5" fill="#00FF66" />

  <!-- Massive, Bold Cybernetic Monogram "L" (Fills ~80% of view area) -->
  <g filter="url(#glow)">
    <path d="M 30 24 
             L 58 24 
             L 58 76 
             L 98 76 
             L 98 104 
             L 30 104 
             Z" 
          fill="url(#lGrad)" />
  </g>

  <!-- High-Tech Stencil Core Accents & Highlights -->
  <!-- Top vertical bevel cut -->
  <polygon points="30,24 38,24 30,32" fill="#FFE5D9" opacity="0.9" />
  <!-- Horizontal inner highlight line -->
  <line x1="33" y1="36" x2="55" y2="36" stroke="#FFD8BE" stroke-width="2.5" stroke-linecap="round" />
  <!-- Corner notch cybernetic detail -->
  <polygon points="58,76 68,76 68,86 58,86" fill="#FFFFFF" opacity="0.9" />
  <!-- Bottom base highlight stripe -->
  <line x1="62" y1="100" x2="94" y2="100" stroke="#FFE0B2" stroke-width="2" stroke-linecap="round" />
  <!-- Mini status LED dot inside upper quadrant -->
  <circle cx="86" cy="38" r="3.5" fill="#00FF66" />
  <circle cx="86" cy="38" r="1.5" fill="#FFFFFF" />
</svg>
