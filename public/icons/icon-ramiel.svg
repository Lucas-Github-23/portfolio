<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <linearGradient id="facetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#00BCD4" />
    </linearGradient>
    <linearGradient id="facetTopRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="facetBottomLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0097A7" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>
    <linearGradient id="facetBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01579B" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="26" fill="url(#bgGrad2)" />
  <rect width="124" height="124" x="2" y="2" rx="24" fill="none" stroke="#102a45" stroke-width="2" />

  <!-- Concentric Octagonal AT-Field Wave Lines -->
  <polygon points="64,16 98,30 112,64 98,98 64,112 30,98 16,64 30,30" 
           fill="none" stroke="#FF9100" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 3" />
  <polygon points="64,24 92,36 104,64 92,92 64,104 36,92 24,64 36,36" 
           fill="none" stroke="#FFAB00" stroke-width="1.8" opacity="0.55" />

  <!-- Ramiel 3D Octahedron Facets -->
  <g filter="url(#cyanGlow)">
    <!-- Top-Left Facet -->
    <polygon points="64,22 28,64 64,64" fill="url(#facetTopLeft)" />
    <!-- Top-Right Facet -->
    <polygon points="64,22 100,64 64,64" fill="url(#facetTopRight)" />
    <!-- Bottom-Left Facet -->
    <polygon points="64,106 28,64 64,64" fill="url(#facetBottomLeft)" />
    <!-- Bottom-Right Facet -->
    <polygon points="64,106 100,64 64,64" fill="url(#facetBottomRight)" />

    <!-- Crystal Seam Edge Highlights -->
    <line x1="64" y1="22" x2="64" y2="106" stroke="#E0F7FA" stroke-width="1.8" />
    <line x1="28" y1="64" x2="100" y2="64" stroke="#E0F7FA" stroke-width="1.8" />
    <polygon points="64,22 100,64 64,106 28,64" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Glowing Core & Laser Reticle -->
  <circle cx="64" cy="64" r="7" fill="#FF1744" stroke="#FFE082" stroke-width="1.5" />
  <circle cx="64" cy="64" r="2.5" fill="#FFFFFF" />

  <!-- Tactical HUD Target Ticks -->
  <line x1="64" y1="10" x2="64" y2="18" stroke="#00E5FF" stroke-width="2" />
  <line x1="64" y1="110" x2="64" y2="118" stroke="#00E5FF" stroke-width="2" />
  <line x1="10" y1="64" x2="18" y2="64" stroke="#00E5FF" stroke-width="2" />
  <line x1="110" y1="64" x2="118" y2="64" stroke="#00E5FF" stroke-width="2" />
</svg>
