<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a06" />
      <stop offset="100%" stop-color="#191309" />
    </linearGradient>
    <linearGradient id="magiAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF9100" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="26" fill="url(#bgGrad3)" />
  <rect width="124" height="124" x="2" y="2" rx="24" fill="none" stroke="#2a1f10" stroke-width="2" />

  <!-- Outer MAGI Inverted Triad Framework -->
  <polygon points="64,114 18,34 110,34" 
           fill="none" stroke="#FF8F00" stroke-width="3" stroke-linejoin="round" opacity="0.4" />
  
  <!-- Interconnecting Circuit Data Buses -->
  <line x1="64" y1="36" x2="38" y2="80" stroke="#FFAB00" stroke-width="2" stroke-dasharray="3 2" />
  <line x1="64" y1="36" x2="90" y2="80" stroke="#FFAB00" stroke-width="2" stroke-dasharray="3 2" />
  <line x1="38" y1="80" x2="90" y2="80" stroke="#FFAB00" stroke-width="2" stroke-dasharray="3 2" />

  <!-- MAGI Node 1: MELCHIOR-1 (Top Center) -->
  <g filter="url(#goldGlow)">
    <polygon points="64,18 78,26 78,42 64,50 50,42 50,26" fill="#141008" stroke="#FF9100" stroke-width="2" />
    <text x="64" y="38" fill="#FFB300" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="12" text-anchor="middle">1</text>
  </g>

  <!-- MAGI Node 2: BALTHASAR-2 (Bottom Left) -->
  <g filter="url(#goldGlow)">
    <polygon points="36,66 50,74 50,90 36,98 22,90 22,74" fill="#141008" stroke="#00E676" stroke-width="2" />
    <text x="36" y="86" fill="#00E676" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="12" text-anchor="middle">2</text>
  </g>

  <!-- MAGI Node 3: CASPAR-3 (Bottom Right) -->
  <g filter="url(#goldGlow)">
    <polygon points="92,66 106,74 106,90 92,98 78,90 78,74" fill="#141008" stroke="#FF1744" stroke-width="2" />
    <text x="92" y="86" fill="#FF1744" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="12" text-anchor="middle">3</text>
  </g>

  <!-- Central MAGI Consensus Eye -->
  <circle cx="64" cy="68" r="6" fill="#FF9100" />
  <circle cx="64" cy="68" r="2" fill="#FFFFFF" />

  <!-- Stencil Subtitle -->
  <text x="64" y="118" fill="#FFB300" font-family="'Courier New', monospace, sans-serif" font-weight="bold" font-size="9" text-anchor="middle" letter-spacing="1">MAGI // SYS</text>
</svg>
